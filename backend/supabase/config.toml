project_id = "la-casilla"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54329

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://lacasillacasarural.com", "https://www.lacasillacasarural.com"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.send-reservation]
verify_jwt = false

[functions.send-contact]
verify_jwt = false

# create-payment-link: called by an authenticated admin session — keep the
# platform's own JWT check (default, so no entry needed) as defense in depth
# on top of the RLS-based staff check inside the handler itself.

# stripe-webhook: called by Stripe's servers, which never carry a Supabase
# JWT — authenticity here comes entirely from verifying the Stripe-Signature
# header (see _shared/stripe.ts), not from Supabase's gateway.
[functions.stripe-webhook]
verify_jwt = false
